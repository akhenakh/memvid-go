[package]
name = "memvid-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
memvid-core = { git = "https://github.com/memvid/memvid", features = ["lex", "vec", "clip", "whisper", "temporal_track", "encryption"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
